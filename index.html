<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجزئة العملاء ورحلتهم — متاجر سلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<script src="./config.js"></script>
<script src="./lib/segmentation.js"></script>
<style>
:root{
  /* daylight (default) — easy on the eyes, suits the brand logos */
  --bg:#eaeef2;--panel:#ffffff;--panel-2:#f1f5f8;--line:#d8e0e8;
  --txt:#16202a;--txt-2:#54636f;--txt-3:#83929e;--accent:#2a9fc4;--accent-2:#5fa630;
  --good:#15a06b;--warn:#b9810b;--bad:#d6453f;--radius:14px;--gap:16px;
  --shadow:0 1px 3px rgba(16,32,48,.07),0 1px 2px rgba(16,32,48,.05);
}
[data-theme="dark"]{
  --bg:#141b21;--panel:#1b242c;--panel-2:#222e38;--line:#2e3a44;
  --txt:#eaf0f4;--txt-2:#9fb0bc;--txt-3:#6f7e8a;--accent:#54bcdb;--accent-2:#84bf41;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding:22px}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:22px;font-weight:800}
h2{font-size:15px;font-weight:700;margin-bottom:14px}
.sub{color:var(--txt-2);font-size:13px;margin-top:3px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--txt-2);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:.15s}
.tab:hover{color:var(--txt);border-color:#3a4654}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

.statusbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--txt-2);margin-bottom:14px}
.pill{font-weight:700;padding:3px 11px;border-radius:20px;font-size:11.5px}
.pill.live{background:rgba(52,211,153,.15);color:var(--good)}
.pill.sample,.pill.offline{background:rgba(251,191,36,.14);color:var(--warn)}
.pill.error{background:rgba(248,113,113,.15);color:var(--bad)}
.banner{background:linear-gradient(90deg,rgba(124,92,255,.14),rgba(79,140,255,.07));border:1px solid var(--line);border-inline-start:3px solid var(--accent-2);
  border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--txt-2);margin-bottom:16px;display:none}
.banner.show{display:block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px}
.kpi .l{font-size:11.5px;color:var(--txt-3);font-weight:700}
.kpi-row-label{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--txt-2);margin:6px 0 -4px;display:flex;align-items:center;gap:8px}
.kpi-row-label::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--accent)}
.kpi-row-label.snap::before{background:var(--accent-2)}
.kpi.snap{background:var(--panel-2);border-style:dashed}
.kpi .v{font-size:25px;font-weight:800;margin-top:6px}
.kpi .d{font-size:11.5px;color:var(--txt-2);margin-top:3px}

.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
canvas{max-height:300px}

.funnel{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.fn-row{display:flex;align-items:center;gap:12px}
.fn-name{width:96px;font-size:13px;color:var(--txt-2);font-weight:700;flex-shrink:0}
.fn-bar-wrap{flex:1;background:var(--panel-2);border-radius:7px;overflow:hidden;height:30px}
.fn-bar{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:800;color:#0b0e12;min-width:42px;transition:width .5s}
.fn-meta{font-size:11.5px;color:var(--txt-3);width:120px;text-align:start;flex-shrink:0}

.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:var(--gap)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;background:var(--accent)}
.stage h4{font-size:14px;font-weight:800;margin-bottom:8px}
.stage .row{font-size:11.5px;color:var(--txt-2);margin-bottom:7px}
.stage .row b{color:var(--txt-3);display:block;font-size:10px;margin-bottom:1px}
.stage .mot{font-size:11px;color:var(--warn);background:rgba(251,191,36,.08);border-radius:6px;padding:6px 7px;margin-top:6px}
.stage .mot b{display:block;font-size:9.5px;color:var(--txt-3);margin-bottom:2px}
.stage .segs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;color:#0b0e12;white-space:nowrap}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:start;padding:10px 11px;border-bottom:2px solid var(--line);color:var(--txt-3);font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--txt)}
tbody td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel-2)}
.seg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px;vertical-align:middle}
.seg-name{font-weight:700}
.ch{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin:1px 0 1px 4px;background:var(--panel-2);border:1px solid var(--line);color:var(--txt-2)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.play{font-size:12px;color:var(--txt-2);max-width:300px}
.tier{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px}
.tier.High{background:rgba(52,211,153,.14);color:var(--good)}
.tier.Mid{background:rgba(79,140,255,.14);color:var(--accent)}
.tier.Low{background:rgba(155,167,180,.12);color:var(--txt-2)}
.delta{font-size:11px;font-weight:800;margin-inline-start:6px;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.delta.up{color:var(--good);background:rgba(52,211,153,.13)}
.delta.down{color:var(--bad);background:rgba(248,113,113,.13)}
.delta.flat{color:var(--txt-2);background:var(--panel-2)}
.tab.sm{padding:6px 13px;font-size:12.5px}
.lnk{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:700}
.lnk:hover{text-decoration:underline}
a.tab.sm{text-decoration:none;display:inline-flex;align-items:center}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.reco-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.gl-sec h4{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px}
.gl-sec .gi{font-size:12px;color:var(--txt-2);margin-bottom:7px;line-height:1.7}
.gl-sec .gi b{color:var(--txt);font-weight:700}
tbody tr.sel{background:rgba(124,92,255,.12)}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.rfm{font-weight:800;font-variant-numeric:tabular-nums}
select,input.search{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
input.search{width:220px;max-width:46vw}
input.search:focus{outline:none;border-color:var(--accent)}
.srch-result{margin-bottom:14px}
.cust-card{background:var(--panel-2);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:12px;padding:16px 18px}
.cust-card .nm{font-size:17px;font-weight:800}
.cust-card .meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:10px;font-size:12.5px;color:var(--txt-2)}
.cust-card .meta b{color:var(--txt-3);font-weight:700;margin-inline-end:5px}
.cust-card .contact{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12.5px}
.cust-card a.salla{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;text-decoration:none;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:700}
.cust-card a.salla:hover{filter:brightness(1.1)}
.sec-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sec-head h2{margin-bottom:0}
footer{color:var(--txt-3);font-size:11.5px;margin-top:10px;text-align:center}
#toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);
  color:var(--txt);padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:90vw}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.spinner{text-align:center;color:var(--txt-2);padding:40px;font-size:14px}
@media(max-width:920px){.grid2{grid-template-columns:1fr}.journey{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.journey{grid-template-columns:1fr}}
/* contrast: panels lift off the background (shadow in light, flat in dark) */
.kpi,.card,.cust-card{box-shadow:var(--shadow)}
/* brand: per-store logo — crisp mark by the title + a faint watermark in the corner */
.brandbg{position:fixed;bottom:-30px;inset-inline-start:-30px;width:38vw;max-width:440px;height:60vh;
  background-position:center;background-repeat:no-repeat;background-size:contain;opacity:.05;pointer-events:none;z-index:0;
  filter:grayscale(.2)}
.wrap{position:relative;z-index:1}
.brandmark{height:36px;width:auto;max-width:130px;flex-shrink:0;border-radius:7px;background:#fff;padding:3px 5px;object-fit:contain}
h1{display:flex;align-items:center;gap:11px}
.brandfoot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:12px}
/* theme toggle */
.icobtn{background:var(--panel);border:1px solid var(--line);color:var(--txt-2);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:700}
.icobtn:hover{color:var(--txt);border-color:var(--accent)}
/* in-page section nav */
.secnav{position:sticky;top:0;z-index:5;display:flex;gap:7px;flex-wrap:wrap;padding:10px 0;margin-bottom:6px;background:var(--bg);border-bottom:1px solid var(--line)}
.secnav a{font-size:12px;font-weight:700;color:var(--txt-2);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;text-decoration:none;white-space:nowrap}
.secnav a:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
/* collapsible cards (header = .sec-head wrapper or a bare h2 direct child) */
.card.collapsible>.sec-head,.card.collapsible>h2{cursor:pointer;user-select:none}
.card.collapsible>.sec-head h2::after,.card.collapsible>h2::after{content:" ▾";color:var(--txt-3);font-size:12px;font-weight:400}
.card.collapsed>.sec-head h2::after,.card.collapsed>h2::after{content:" ▸"}
.card.collapsed>*:not(.sec-head):not(h2){display:none!important}
/* freshness / updating badge */
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-2)}
.fresh .dotpulse{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="brandbg"></div>
<div class="wrap">
  <header class="top">
    <div><h1><img class="brandmark" id="brandLogo" alt="" src="./Build_Station_Logo.jpeg"><span id="ttl"></span></h1><div class="sub" id="subttl"></div></div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <div class="tabs" id="storeTabs"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="icobtn" id="themeBtn" type="button" title="تبديل الوضع الليلي/النهاري">🌙</button>
        <button class="tab sm" id="glossaryBtn" type="button"></button>
        <a class="tab sm" id="calendarLink" href="./calendar.html"></a>
      </div>
    </div>
  </header>

  <div class="card" id="glossaryCard" style="display:none;margin-bottom:var(--gap)">
    <div class="sec-head"><h2 id="t-glossary"></h2></div>
    <div id="glossaryBody" class="glossary-grid"></div>
  </div>

  <div class="statusbar">
    <span id="srcPill" class="pill sample">…</span>
    <span id="srcMeta"></span>
  </div>
  <div class="banner" id="banner"></div>

  <div class="statusbar" style="margin-top:-4px">
    <span class="sub" id="t-ctype"></span>
    <div class="tabs" id="ctypeTabs"></div>
  </div>

  <div class="statusbar" style="margin-top:-4px;gap:10px 14px">
    <label class="sub" id="t-gran" for="granSelect"></label>
    <select id="granSelect"></select>
    <label class="sub" id="t-month" for="monthFilter"></label>
    <select id="monthFilter"></select>
    <button class="btn" id="exportBtn"></button>
    <span class="sub" id="monthHint"></span>
  </div>
  <div class="banner" id="snapshotNote" style="display:none"></div>

  <nav class="secnav" id="secnav"></nav>

  <section class="kpis" id="kpis"><div class="spinner">جارٍ التحميل…</div></section>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head"><h2 id="t-trends"></h2></div>
    <canvas id="trendChart"></canvas>
    <div class="tbl-wrap" style="margin-top:16px">
      <div class="sub" id="t-monthly-table" style="margin-bottom:8px"></div>
      <table id="monthlyTable"><thead><tr id="monthlyHead"></tr></thead><tbody id="monthlyBody"></tbody></table>
    </div>
  </div>

  <div class="grid2">
    <div class="card"><h2 id="t-seg"></h2><canvas id="segChart"></canvas></div>
    <div class="card"><h2 id="t-rev"></h2><canvas id="revChart"></canvas></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <h2 id="t-funnel"></h2><div class="funnel" id="funnel"></div>
  </div>

  <div class="sec-head"><div><h2 id="t-journey"></h2><div class="sub" id="t-journey-sub"></div></div></div>
  <div class="journey" id="journey"></div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head"><div><h2 id="t-geo"></h2><div class="sub" id="t-geo-sub"></div></div></div>
    <div class="tbl-wrap"><table id="geoTable"><thead><tr id="geoHead"></tr></thead><tbody id="geoBody"></tbody></table></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head"><div><h2 id="t-cat"></h2><div class="sub" id="t-cat-sub"></div></div></div>
    <div class="tbl-wrap"><table id="catTable"><thead><tr id="catHead"></tr></thead><tbody id="catBody"></tbody></table></div>
    <div class="sub" id="catNote" style="margin-top:8px"></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head">
      <div><h2 id="t-aband"></h2><div class="sub" id="t-aband-sub"></div></div>
      <div style="display:flex;gap:8px 20px;flex-wrap:wrap;font-size:12.5px;color:var(--txt-2)">
        <div><span id="abandCount" class="num"></span> · <span id="t-aband-count"></span></div>
        <div><span id="abandValue" class="num"></span> · <span id="t-aband-value"></span></div>
      </div>
    </div>
    <div class="tbl-wrap"><table id="abandTable"><thead><tr id="abandHead"></tr></thead><tbody id="abandBody"></tbody></table></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head">
      <div><h2 id="t-failed"></h2><div class="sub" id="t-failed-sub"></div></div>
      <div style="display:flex;gap:8px 20px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--txt-2)">
        <div><span id="failedCount" class="num"></span> · <span id="t-failed-count"></span></div>
        <div><span id="failedValue" class="num"></span> · <span id="t-failed-value"></span></div>
        <a id="failedLog" class="ch" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div class="tbl-wrap"><table id="failedTable"><thead><tr id="failedHead"></tr></thead><tbody id="failedBody"></tbody></table></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head"><div><h2 id="t-cj"></h2><div class="sub" id="t-cj-sub"></div></div></div>
    <div class="kpis" id="cjKpis" style="margin-bottom:var(--gap)"></div>
    <div class="grid2">
      <div><div class="sub" id="t-cj-funnel" style="margin-bottom:8px"></div><div class="funnel" id="cjFunnel"></div></div>
      <div><div class="sub" id="t-cj-conv" style="margin-bottom:8px"></div><div id="cjConv"></div></div>
    </div>
    <div class="sub" id="t-cj-reco" style="margin:18px 0 8px"></div>
    <div id="cjReco" class="reco-grid"></div>
    <div class="sub" id="cjNote" style="margin-top:10px"></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head"><h2 id="t-act"></h2></div>
    <div class="tbl-wrap"><table id="actTable"><thead><tr id="actHead"></tr></thead><tbody id="actBody"></tbody></table></div>
  </div>

  <div class="card" style="margin-bottom:var(--gap)">
    <div class="sec-head">
      <h2 id="t-cust"></h2>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="custSearch" class="search" type="search">
        <button class="btn" id="custSearchBtn"></button>
        <label class="sub" id="t-filter" style="margin-inline-end:6px"></label><select id="segFilter"></select>
      </div>
    </div>
    <div class="srch-result" id="searchResult"></div>
    <div class="tbl-wrap"><table id="custTable"><thead><tr id="custHead"></tr></thead><tbody id="custBody"></tbody></table></div>
    <div class="sub" id="t-showing" style="margin-top:10px"></div>
  </div>

  <div class="brandfoot">
    <span style="color:var(--accent);font-weight:800">محطة البناء · Build Station</span>
    <span style="color:var(--accent-2);font-weight:800">مخازن الإضاءة · Lighting</span>
    <span style="color:var(--txt);font-weight:800">HATCH</span>
  </div>
  <footer id="t-footer"></footer>
</div>
<div id="toast"></div>

<script>
const C = window.CONFIG, U = C.UI, S = window.SEG;
let current = Object.keys(C.STORES)[0];
let cache = {};                     // storeKey → aggregate object
let segFilterVal = "", custSort = {k:"revenue",dir:-1}, actSort = {k:"revenue",dir:-1};
let periodSel = "";                 // "" = all time; else a period key ("2025-06", "2025-Q2", "2025")
let gran = "month";                 // trend/period granularity: month | quarter | year
let typeSel = "";                   // "" = all customers; else "B2B" | "B2C"  (Phase 2 cohort)
let segChart, revChart, trendChart;
const cssvSafe = v => v;            // colors come straight from config
const fmtN = v => (v>=1e3?(v/1e3).toFixed(1)+"K":(""+Math.round(v)));
const fmtSAR = v => v>=1e6?("SAR "+(v/1e6).toFixed(1)+"M"): v>=1e3?("SAR "+(v/1e3).toFixed(1)+"K"):("SAR "+Math.round(v));
/* hover shows the full number (e.g. 11.3K → 11,319). grp = grouped full integer;
   tN/tSAR wrap an abbreviated value in a .num span carrying the full value as title. */
const grp = v => (Math.round(Number(v)||0)).toLocaleString("en-US");
const tN = v => `<span class="num" title="${grp(v)}">${fmtN(v)}</span>`;
const tSAR = v => `<span class="num" title="${grp(v)} ﷼">${fmtSAR(v)}</span>`;
const segColor = s => (C.SEGMENTS[s]||{}).color || "#888";
/* theme-aware chart colors (read live CSS vars so light/dark + per-store accent apply) */
function chartColors(){const s=getComputedStyle(document.documentElement);const g=n=>s.getPropertyValue(n).trim();return {txt2:g('--txt-2'),txt3:g('--txt-3'),line:g('--line'),panel:g('--panel'),accent:g('--accent'),accent2:g('--accent-2'),good:g('--good')};}
/* light (daylight) default + dark toggle, persisted */
const THEME_LS="salla_theme";

/* in-page nav + collapsible sections (page is long) — secondary tables collapsed by default */
function setupNavCollapse(){
  const nav=document.getElementById("secnav"); if(!nav) return;
  const collapseByDefault=new Set(["t-journey","t-cat","t-geo","t-aband","t-failed","t-act"]);
  const cards=[...document.querySelectorAll(".card")].filter(c=>c.querySelector("h2")&&c.id!=="glossaryCard");
  nav.innerHTML="";
  cards.forEach((card,i)=>{
    const h2=card.querySelector("h2"); card.id=card.id||("sec"+i);
    const head=card.querySelector(".sec-head")||h2;
    card.classList.add("collapsible");
    if(!head._navwired){head._navwired=1;head.addEventListener("click",e=>{if(e.target.closest("button,a,select,input,label"))return;card.classList.toggle("collapsed");});}
    if(collapseByDefault.has(h2.id))card.classList.add("collapsed");
    const a=document.createElement("a"); a.href="#"+card.id; a.textContent=(h2.textContent||"").trim()||("قسم "+(i+1));
    a.onclick=e=>{e.preventDefault();card.classList.remove("collapsed");card.scrollIntoView({behavior:"smooth",block:"start"});};
    nav.appendChild(a);
  });
}

/* access gate: ask once for the shared passphrase, keep it in localStorage, and send
   it as x-dash-key on every API call. The server validates it (DASH_ACCESS_KEY) and
   401s if wrong — this is just the UX side. */
const DASH_KEY_LS="salla_dash_key";
function getDashKey(){let k=localStorage.getItem(DASH_KEY_LS);if(!k){k=(window.prompt(U.auth.prompt)||"").trim();if(k)localStorage.setItem(DASH_KEY_LS,k);}return k;}
async function apiFetch(url){
  let r=await fetch(url,{headers:{Accept:"application/json","x-dash-key":getDashKey()}});
  if(r.status===401){localStorage.removeItem(DASH_KEY_LS);window.alert(U.auth.wrong);
    r=await fetch(url,{headers:{Accept:"application/json","x-dash-key":getDashKey()}});}
  return r;
}

   is active, else the combined aggregate. Period/geo/source fields stay from combined d. */
function viewData(){
  const d=cache[current]; if(!d) return d;
  if(typeSel && d.byType && d.byType[typeSel]) return Object.assign({},d,d.byType[typeSel]);
  return d;

/* data load: try backend, fall back to client-side sample */
async function load(){
  renderTabs();
  if(cache[current]){ renderAll(cache[current]); return; }
  document.getElementById("kpis").innerHTML='<div class="spinner">جارٍ التحميل…</div>';
  let data;
  try{
    const r=await apiFetch(`./api/segments?store=${encodeURIComponent(current)}`);
    if(!r.ok) throw new Error("http "+r.status);
    data=await r.json();
    if(data.source==="error") throw new Error(data.error||"error");
  }catch(e){
    // offline demo: mirror the server's cohort split so the B2B/B2C toggle still works.
    const raw=S.genSampleCustomers(current,C); raw.forEach(c=>c.customerType=S.customerTypeOf(c,C));
    const combined=S.scoreStore(raw.map(c=>({...c})),C,current,null);
    const byType={};
    ["B2B","B2C"].forEach(ct=>{ byType[ct]=S.aggregate(S.scoreStore(raw.filter(c=>c.customerType===ct).map(c=>({...c})),C,current,ct),C,current); });
    data=Object.assign({source:"offline",store:current,generatedAt:Date.now(),abandoned:S.genSampleAbandoned(current,C),failedPayments:S.genSampleFailed(current,C)},S.aggregate(combined,C,current),{byType},S.genSampleSeries(current,C));
  }
  cache[current]=data;
  renderAll(data);
}

/* ▲/▼ badge vs the previous period (null prev → no badge) */
function deltaBadge(cur,prev){
  if(prev==null) return "";
  if(prev===0) return cur>0?`<span class="delta up">▲</span>`:`<span class="delta flat">—</span>`;
  const pct=Math.round((cur-prev)/Math.abs(prev)*100);
  if(pct===0) return `<span class="delta flat">0%</span>`;
  return `<span class="delta ${pct>0?'up':'down'}">${pct>0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}
/* sales metrics for the selected period; periodSel="" → aggregate of the whole window
   (last year). Order-based, NOT cohort-split. prev = previous period (for sub-period deltas). */
function periodMetrics(d){
  const series=curSeries(d);
  if(periodSel){
    const idx=series.findIndex(x=>x.period===periodSel);
    return { m: series[idx]||{revenue:0,orders:0,aov:0,newCustomers:0,buyers:0,returned:0}, prev: idx>0?series[idx-1]:null, label: periodSel };
  }
  const agg={revenue:0,orders:0,newCustomers:0,returned:0};
  series.forEach(s=>{ agg.revenue+=s.revenue||0; agg.orders+=s.orders||0; agg.newCustomers+=s.newCustomers||0; agg.returned+=s.returned||0; });
  agg.buyers = d.total||0;                              // unique buyers over the year = customer count
  agg.aov = agg.orders ? Math.round(agg.revenue/agg.orders) : 0;
  return { m: agg, prev: null, label: U.monthly.allTime };
}

/* ── period trend (month/quarter/year) + geographic ───────────────────────── */
// current-granularity series; falls back to `monthly` for any older cached blob.
function curSeries(d){
  const p=d.periods&&d.periods[gran];
  if(p&&p.series) return p.series;
  return gran==="month" ? (d.monthly||[]).map(m=>({period:m.month,revenue:m.revenue,orders:m.orders,aov:m.aov,buyers:m.buyers,newCustomers:m.newCustomers})) : [];
}
function curGeoMap(d){ const p=d.periods&&d.periods[gran]; return (p&&p.geo)||{}; }

function buildPeriodFilter(d){
  const sel=document.getElementById("monthFilter");
  const periods=curSeries(d).map(m=>m.period).reverse();          // newest first
  if(periodSel && !periods.includes(periodSel)) periodSel="";     // not in this series
  sel.innerHTML=`<option value="">${U.monthly.allTime}</option>`+periods.map(m=>`<option value="${m}">${m}</option>`).join("");
  sel.value=periodSel;
}

  renderKPIs(d,viewData()); renderTrends(d); renderPeriodTable(d); renderGeo(d); renderCategories(d); updateSnapshotNote(); }

      {type:"bar",label:U.monthly.revLabel,data:m.map(x=>x.revenue),backgroundColor:barCol,borderRadius:5,yAxisID:"y"},
      {type:"line",label:U.monthly.ordersLabel,data:m.map(x=>x.orders),borderColor:cc.good,backgroundColor:cc.good,tension:.3,yAxisID:"y2"}
    ]},

  const rows=[...curSeries(d)].reverse();

    <td><b class="num">${m.period}</b></td><td>${tSAR(m.revenue)}</td><td>${tN(m.orders)}</td>
    <td>${tSAR(m.aov)}</td><td>${tN(m.newCustomers)}</td><td>${tN(m.buyers)}</td><td>${tN(m.returned||0)}</td></tr>`).join("");
}
function renderGeo(d){
  const c=U.geo.cols;
  const g = periodSel ? (curGeoMap(d)[periodSel]||[]) : (d.geo||[]);
  document.getElementById("t-geo-sub").textContent = periodSel ? (U.monthly.geoForPeriod+" · "+periodSel) : U.geo.sub;

/* #2 — top categories (period-aware, mirrors geo: per-period when a period is selected). */
function renderCategories(d){
  const CC=U.categories, c=CC.cols;

}

/* #3 — top abandoned/failed carts by value (not period-filtered; current open carts). */
function fmtAge(min){const A=U.abandoned; min=Math.max(0,Math.round(min||0)); if(min<60)return min+" "+A.ageMin; if(min<1440)return Math.round(min/60)+" "+A.ageHour; return Math.round(min/1440)+" "+A.ageDay;}
function renderAbandoned(d){
  const A=U.abandoned, c=A.cols, ab=d.abandoned||{count:0,value:0,top:[]};
  document.getElementById("t-aband-sub").textContent=A.sub;
  const ac=document.getElementById("abandCount"); ac.textContent=fmtN(ab.count); ac.title=grp(ab.count);
  const av=document.getElementById("abandValue"); av.textContent=fmtSAR(ab.value); av.title=grp(ab.value)+" ﷼";
  document.getElementById("abandHead").innerHTML=[c.customer,c.value,c.items,c.salla,c.age].map(t=>`<th>${t}</th>`).join("");
  document.getElementById("abandBody").innerHTML=(ab.top||[]).map(r=>{
    const nm = r.customerId ? `<a class="lnk" onclick="viewCustomer('${r.customerId}')" title="${A.view}">${r.name||("#"+r.customerId)}</a>` : (r.name||A.guest);
    const salla = (r.adminUrl && r.adminUrl!=="#") ? `<a class="ch" href="${r.adminUrl}" target="_blank" rel="noopener">${A.openCart}</a>` : "—";
    return `<tr><td class="seg-name">${nm}</td><td>${tSAR(r.total)}</td><td>${tN(r.items)}</td><td>${salla}</td><td>${fmtAge(r.ageMinutes)}</td></tr>`;
  }).join("") || `<tr><td colspan="5" class="sub">—</td></tr>`;
}

/* #3b — top failed electronic payments (from the Salla transactions log). */
function fmtTxDate(s){ return s ? String(s).slice(0,16) : ""; }
function renderFailed(d){
  const F=U.failed, c=F.cols, fp=d.failedPayments||{count:0,customers:0,value:0,top:[]};
  document.getElementById("t-failed-sub").textContent=F.sub;
  const fc=document.getElementById("failedCount"); fc.textContent=fmtN(fp.customers||0); fc.title=grp(fp.count||0)+" محاولة";
  const fv=document.getElementById("failedValue"); fv.textContent=fmtSAR(fp.value); fv.title=grp(fp.value)+" ﷼";
  document.getElementById("failedHead").innerHTML=[c.customer,c.value,c.attempts,c.method,c.date,c.salla].map(t=>`<th>${t}</th>`).join("");
  document.getElementById("failedBody").innerHTML=(fp.top||[]).map(r=>{
    const cust = r.customerId ? `<a class="lnk" onclick="viewCustomer('${r.customerId}')" title="${F.view}">${r.name||("#"+r.customerId)}</a>` : (r.name||F.guest);
    const method = (r.method||"—")+(r.card?` · <span class="num" style="direction:ltr">${r.card}</span>`:"");
    const att = r.attempts>1 ? `<b style="color:var(--warn)">${r.attempts}×</b>` : `${r.attempts}×`;
    const salla = (r.adminUrl && r.adminUrl!=="#") ? `<a class="ch" href="${r.adminUrl}" target="_blank" rel="noopener">${U.abandoned.openCart}</a>` : "—";
    return `<tr><td class="seg-name">${cust}</td><td>${tSAR(r.value)}</td><td><span class="num">${att}</span></td><td>${method}</td><td><span class="num" style="font-size:11px">${fmtTxDate(r.createdAt)}</span></td><td>${salla}</td></tr>`;
  }).join("") || `<tr><td colspan="6" class="sub">—</td></tr>`;

/* #4 — cross-store customer journey (fetched once; cross-store, independent of store tabs) */
let journeyData=null;
const CJCOLS=["#54bcdb","#84bf41","#c3ced6","#fb923c","#f472b6"]; // Build=cyan · Lighting=green · Hatch=light slate
function sampleJourney(){
  const order=(C.CROSS_JOURNEY&&C.CROSS_JOURNEY.order)||Object.keys(C.STORES);
  const stageDist={},perStore={},stageValue={};let total=0,mv=0;
  order.forEach((k,i)=>{const base=Math.round(520/(i+1));stageDist[k]=base;perStore[k]=base+(i<order.length-1?120:0);stageValue[k]=base*1800;total+=base;mv+=base*900;});
  const stages=order.map(k=>({store:k,reach:perStore[k],furthest:stageDist[k],furthestValue:stageValue[k]}));
  const conversions=[];for(let i=0;i<order.length-1;i++)conversions.push({from:order[i],to:order[i+1],rate:[42,28][i]||30,fromCount:perStore[order[i]],both:Math.round(perStore[order[i]]*0.35)});
  const FIRST=["عبدالله","محمد","نورة","خالد","سارة","فيصل","ريم"],LAST=["القحطاني","الحربي","الغامدي","الدوسري","العتيبي"];
  const recommend={};order.forEach((k,i)=>{if(i>0){const cnt=stageDist[order[i-1]];const sample=[];for(let s=0;s<12;s++)sample.push({store:order[i-1],id:String(700000+Math.floor(Math.random()*99999)),name:FIRST[s%FIRST.length]+" "+LAST[s%LAST.length],revenue:Math.round(2000+Math.random()*18000)});sample.sort((a,b)=>b.revenue-a.revenue);recommend[k]={count:cnt,value:sample.reduce((x,c)=>x+c.revenue,0)*3,sample};}});
  return {found:true,sample:true,order,totalMatched:total,multiStore:Math.round(total*0.3),multiStoreValue:mv,stages,conversions,recommend,stageDist,perStore};
}
async function loadJourney(){
  if(!journeyData){
    try{const r=await apiFetch("./api/journey");const j=await r.json();journeyData=(j&&j.found)?j:sampleJourney();}
    catch(e){journeyData=sampleJourney();}
  }
  renderJourney2(journeyData);
}
const stLabel=k=>((C.CROSS_JOURNEY||{}).stageAr&&C.CROSS_JOURNEY.stageAr[k])||(C.STORES[k]&&C.STORES[k].label)||k;
const stStore=k=>(C.STORES[k]&&C.STORES[k].label)||k;
function renderJourney2(j){
  const J=U.journey2, CJ=C.CROSS_JOURNEY||{};
  document.getElementById("t-cj").textContent=J.title;
  document.getElementById("t-cj-sub").textContent=J.sub;
  document.getElementById("t-cj-funnel").textContent=J.kStages;
  document.getElementById("t-cj-conv").textContent=J.convTitle;
  document.getElementById("t-cj-reco").textContent=J.recoTitle;
  document.getElementById("cjNote").textContent=J.coverageNote;
  if(!j||!j.found){document.getElementById("cjKpis").innerHTML=`<div class="sub">${J.none}</div>`;return;}
  const order=j.order||[];
  // mini KPIs
  document.getElementById("cjKpis").innerHTML=[
    {l:J.kMatched,v:fmtN(j.totalMatched),r:grp(j.totalMatched)},
    {l:J.kMulti,v:fmtN(j.multiStore),r:grp(j.multiStore)},
    {l:J.kValue,v:fmtSAR(j.multiStoreValue||0),r:grp(j.multiStoreValue||0)+" ﷼"}
  ].map(c=>`<div class="kpi"><div class="l">${c.l}</div><div class="v"><span class="num" title="${c.r}">${c.v}</span></div></div>`).join("");
  // stage funnel: reach + "furthest here" + value
  const stages=j.stages||order.map(k=>({store:k,reach:(j.perStore||{})[k]||0,furthest:(j.stageDist||{})[k]||0,furthestValue:0}));
  const max=Math.max(1,...stages.map(s=>s.reach||0));
  document.getElementById("cjFunnel").innerHTML=stages.map((s,i)=>{
    const w=Math.max(6,(s.reach||0)/max*100);
    return `<div class="fn-row"><div class="fn-name">${stLabel(s.store)}</div>
      <div class="fn-bar-wrap"><div class="fn-bar" style="width:${w}%;background:${CJCOLS[i%CJCOLS.length]}"><span class="num" title="${grp(s.reach)}">${fmtN(s.reach)}</span></div></div>
      <div class="fn-meta">${J.hereCol}: <span class="num">${fmtN(s.furthest)}</span> · ${fmtSAR(s.furthestValue||0)}</div></div>`;
  }).join("");
  // conversion rates between stages
  document.getElementById("cjConv").innerHTML=(j.conversions||[]).map(c=>
    `<div class="fn-row"><div class="fn-bar-wrap" style="height:24px"><div class="fn-bar" style="width:${Math.max(6,c.rate)}%;background:var(--good)"><span class="num">${c.rate}%</span></div></div>
     <div class="fn-meta" style="width:auto;flex:1">${J.convLine(stStore(c.from),stStore(c.to))}</div></div>`).join("") || `<div class="sub">—</div>`;
  // recommendations with actionable candidate customer lists
  const recos=order.map(k=>({k,rec:j.recommend&&j.recommend[k]})).filter(x=>x.rec&&x.rec.count>0);
  document.getElementById("cjReco").innerHTML=recos.map(x=>{
    const idxN=order.indexOf(x.k), action=(CJ.recommendAr&&CJ.recommendAr[order[idxN-1]])||"";
    const rows=(x.rec.sample||[]).map(c=>`<tr>
      <td><a class="lnk" onclick="journeyView('${c.id}','${c.store}')">${c.name||("#"+c.id)}</a></td>
      <td class="sub">${stStore(c.store)}</td><td>${tSAR(c.revenue)}</td></tr>`).join("");
    return `<div class="cust-card" style="padding:12px 14px;margin:0">
      <div><span class="num" title="${grp(x.rec.count)}" style="font-weight:800;color:var(--accent);font-size:16px">${fmtN(x.rec.count)}</span>
        ${J.recoLine("",stStore(x.k),fmtSAR(x.rec.value||0))}</div>
      ${action?`<div class="sub" style="margin:5px 0 8px">${action}</div>`:""}
      ${rows?`<div class="sub" style="margin-bottom:4px">${J.candTitle}</div><div class="tbl-wrap"><table><thead><tr><th>${J.candCols.customer}</th><th>${J.candCols.store}</th><th>${J.candCols.value}</th></tr></thead><tbody>${rows}</tbody></table></div>`:""}
    </div>`;
  }).join("") || `<div class="sub">—</div>`;
}
/* click a customer → OPEN their Salla account in a NEW TAB + show the card in place
   (no scroll/navigation). The blank tab is opened synchronously (in the click gesture) to
   dodge popup blockers, then pointed at the admin URL once the lookup returns. store is
   optional (journey candidates live in their own store). */
async function openCustomerTab(id,store){
  const SRx=document.getElementById("searchResult");
  const w=window.open("about:blank","_blank");           // reserve the tab within the user gesture
  document.getElementById("custSearch").value=id;
  SRx.innerHTML=`<div class="spinner">${U.search.searching}</div>`;
  let d; try{const r=await apiFetch(`./api/customer?store=${encodeURIComponent(store||current)}&id=${encodeURIComponent(id)}`);d=await r.json();}
  catch(e){ if(w)w.close(); SRx.innerHTML=`<div class="cust-card">${U.search.noResult}</div>`; return; }
  const adminUrl=(d.contact&&d.contact.adminUrl)||"";
  if(d.customer)SRx.innerHTML=customerCard(d.customer,d.contact);
  else if(d.found&&d.contact)SRx.innerHTML=contactCard(id,d.contact);
  else SRx.innerHTML=`<div class="cust-card">${U.search.noResult}</div>`;
  if(w){ if(adminUrl)w.location.href=adminUrl; else w.close(); }   // open account, or close the blank tab
}
const journeyView=openCustomerTab;

/* CSV export — a selected period exports that period's metrics + its city breakdown;
   otherwise the whole current-granularity series. UTF-8 BOM so Excel reads Arabic. */
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportReport(){
  const d=cache[current]; if(!d) return;
  const c=U.monthly.cols, series=curSeries(d);
  const rows=[[c.period,c.sales,c.orders,c.aov,c.newCust,c.buyers,c.returned]];
  (periodSel?series.filter(s=>s.period===periodSel):series).forEach(s=>rows.push([s.period,s.revenue,s.orders,s.aov,s.newCustomers,s.buyers,s.returned||0]));
  if(periodSel){
    const geo=curGeoMap(d)[periodSel]||[];
    if(geo.length){ rows.push([]); rows.push([U.geo.cols.city,U.geo.cols.revenue,U.geo.cols.customers,U.geo.cols.orders]);
      geo.forEach(x=>rows.push([x.city||U.geo.unknown,x.revenue,x.customers,x.orders])); }
  }
  const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`${current}_${gran}_${periodSel||"all"}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function renderAll(d){
  const v=viewData();                            // cohort aggregate for the snapshot panels
  renderTabs(); renderCohortTabs(); renderStatus(d); buildPeriodFilter(d); updateSnapshotNote();
  renderKPIs(d,v); renderTrends(d); renderPeriodTable(d);
  renderSegChart(v); renderRevChart(v); renderFunnel(v); renderJourney(v);
  renderGeo(d); renderCategories(d); renderAbandoned(d); renderFailed(d); renderActivation(v); renderCustomers(v);
}
document.getElementById("monthFilter").onchange=e=>{periodSel=e.target.value;refreshPeriodPanels();};
document.getElementById("granSelect").onchange=e=>{gran=e.target.value;periodSel="";buildPeriodFilter(cache[current]);refreshPeriodPanels();};

/* sorting + filter */
document.getElementById("actTable").querySelector("thead").addEventListener("click",e=>{

document.getElementById("segFilter").onchange=e=>{segFilterVal=e.target.value;renderCustomers(viewData());};

/* export stub */
function exportSeg(seg,count){
  const chans=C.SEGMENTS[seg].channels.map(c=>U.channels[c]).join("، ");
  toast(U.exportToast(count,segAr(seg),C.STORES[current].label,chans));

let tT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),4600);}

/* customer search — id → full record + live Salla contact; text → matching list */
const SR=document.getElementById("searchResult");
async function doCustomerSearch(){
  const v=document.getElementById("custSearch").value.trim();
  if(!v){SR.innerHTML="";return;}
  SR.innerHTML=`<div class="spinner">${U.search.searching}</div>`;
  const qs=/^\d+$/.test(v)?`id=${encodeURIComponent(v)}`:`q=${encodeURIComponent(v)}`;
  let d;
  try{const r=await apiFetch(`./api/customer?store=${encodeURIComponent(current)}&${qs}`);d=await r.json();}
  catch(e){SR.innerHTML=`<div class="cust-card">${U.search.noResult}</div>`;return;}
  if(d.note){SR.innerHTML=`<div class="cust-card">${U.search.needRefresh}</div>`;return;}
  if(d.customer){SR.innerHTML=customerCard(d.customer,d.contact);return;}
  if(d.found&&d.contact){SR.innerHTML=contactCard(v,d.contact);return;}  // cart customer not in index → contact-only
  if(d.matches&&d.matches.length){SR.innerHTML=matchesList(d.matches);return;}
  SR.innerHTML=`<div class="cust-card">${U.search.noResult}</div>`;
}
/* minimal card for a customer found live (e.g. abandoned-cart customer) but not in the RFM index */
function contactCard(id,contact){
  const s=U.search;
  return `<div class="cust-card">
    <div class="nm"><span class="sub num" style="font-size:13px">#${id}</span></div>
    ${contact?`<div class="contact">
      ${contact.email?`<span><b>${s.email}</b><span class="num">${contact.email}</span></span>`:""}
      ${contact.mobile?`<span><b>${s.mobile}</b><span class="num" style="direction:ltr">${contact.mobile}</span></span>`:""}
      ${contact.city?`<span><b>${s.city}</b>${contact.city}</span>`:""}
    </div>${contact.adminUrl?`<a class="salla" href="${contact.adminUrl}" target="_blank" rel="noopener">${s.openInSalla} ↗</a>`:""}`
    :`<div class="contact">${s.noContact}</div>`}</div>`;
}
function customerCard(c,contact){
  const s=U.search;
  const contactHtml=contact?`<div class="contact">
      ${contact.email?`<span><b>${s.email}</b><span class="num">${contact.email}</span></span>`:""}
      ${contact.mobile?`<span><b>${s.mobile}</b><span class="num" style="direction:ltr">${contact.mobile}</span></span>`:""}
      ${contact.city?`<span><b>${s.city}</b>${contact.city}</span>`:""}
    </div>${contact.adminUrl?`<a class="salla" href="${contact.adminUrl}" target="_blank" rel="noopener">${s.openInSalla} ↗</a>`:""}`
    :`<div class="contact">${s.noContact}</div>`;
  return `<div class="cust-card">
    <div class="nm">${c.name} <span class="sub num" style="font-size:12px">#${c.id}</span></div>
    <div class="meta">
      <span><b>${U.custCols.orders}</b><span class="num">${c.orders}</span></span>
      <span><b>${U.custCols.revenue}</b>${tSAR(c.revenue)}</span>
      <span><b>${U.custCols.recency}</b>منذ <span class="num">${c.recencyDays}</span> ${U.daysAgo}</span>
      <span><b>RFM</b><span class="rfm num">${c.R}${c.F}${c.M}</span></span>
      <span><b>${U.custCols.segment}</b><span class="seg-dot" style="background:${segColor(c.segment)}"></span>${segAr(c.segment)}</span>
      <span><b>${U.custCols.tier}</b><span class="tier ${c.tier}">${U.tiers[c.tier]}</span></span>
    </div>${contactHtml}</div>`;
}
function matchesList(ms){
  const s=U.search;
  const rows=ms.map(c=>`<tr>
    <td><span class="seg-name">${c.name}</span><div class="sub" style="font-size:11px"><span class="num">#${c.id}</span></div></td>
    <td><span class="num">${c.orders}</span></td>
    <td>${tSAR(c.revenue)}</td>
    <td><span class="seg-dot" style="background:${segColor(c.segment)}"></span>${segAr(c.segment)}</td>
    <td><button class="btn" onclick="viewCustomer('${c.id}')">${s.view}</button></td>
  </tr>`).join("");
  return `<div class="cust-card" style="padding:8px 12px"><div class="sub" style="margin:6px 4px 10px">${s.matchesTitle} — <span class="num">${ms.length}</span></div>
    <div class="tbl-wrap"><table><tbody>${rows}</tbody></table></div></div>`;
}
function viewCustomer(id){openCustomerTab(id,current);}
document.getElementById("custSearchBtn").onclick=doCustomerSearch;
document.getElementById("custSearch").addEventListener("keydown",e=>{if(e.key==="Enter")doCustomerSearch();});
document.getElementById("custSearch").addEventListener("search",doCustomerSearch);

/* theme + brand init */
applyTheme(localStorage.getItem(THEME_LS)||"light");
applyStoreBrand(current);
setupNavCollapse();
document.getElementById("themeBtn").onclick=()=>{const dark=document.documentElement.getAttribute("data-theme")==="dark";applyTheme(dark?"light":"dark");applyStoreBrand(current);if(cache[current])renderAll(cache[current]);if(journeyData)renderJourney2(journeyData);};

load();
loadJourney();
</script>
